name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build a 404-only GitHub Pages site
        run: node scripts/build-github-redirects.mjs
      - name: Reject any Pages artifact besides 404.html
        run: |
          mapfile -t files < <(find github-pages -type f | sort)
          test "${#files[@]}" -eq 1
          test "${files[0]}" = "github-pages/404.html"
          grep -q '<meta name="robots" content="noindex">' github-pages/404.html
          grep -q 'https://clearcalc-tools.pages.dev/' github-pages/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: github-pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
