name: Deploy website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build GitHub Pages redirects to clearcalctools.com
        run: node scripts/build-github-redirects.mjs
      - name: Reject redirect pages that leave clearcalctools.com or include site content
        run: |
          set -euo pipefail
          node scripts/build-github-redirects.mjs --check
          mapfile -t files < <(find github-pages -type f | sort)
          test "${#files[@]}" -gt 1
          for f in "${files[@]}"; do
            case "$f" in
              github-pages/robots.txt)
                grep -q '^User-agent: \*$' "$f"
                grep -q '^Allow: /$' "$f"
                if grep -q '^Disallow:' "$f"; then
                  echo "robots.txt must allow crawling" >&2
                  exit 1
                fi
                ;;
              *.html|*.xml)
                grep -q '<meta http-equiv="refresh" content="0; url=https://clearcalctools.com/' "$f"
                grep -q '<link rel="canonical" href="https://clearcalctools.com/' "$f"
                grep -q 'location.replace("https://clearcalctools.com/' "$f"
                grep -q '<a href="https://clearcalctools.com/' "$f"
                if grep -E -q 'pages\.dev|github\.io' "$f"; then
                  echo "legacy host in $f" >&2
                  exit 1
                fi
                if grep -q 'noindex' "$f"; then
                  echo "noindex in $f" >&2
                  exit 1
                fi
                if grep -E -q 'ld\+json|data-slug|class="calculator"|class="article"|ClearCalc Tools' "$f"; then
                  echo "site content in $f" >&2
                  exit 1
                fi
                size=$(wc -c < "$f")
                test "$size" -lt 2048
                ;;
              *)
                echo "unexpected GitHub Pages artifact: $f" >&2
                exit 1
                ;;
            esac
          done
          test -f github-pages/index.html
          test -f github-pages/404.html
          test "$(find github-pages/calculators -type f -name index.html | wc -l)" -ge 1
          mapfile -t sitemaps < <(find github-pages -type f -name 'sitemap-*.xml' | sort)
          test "${#sitemaps[@]}" -ge 1
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: github-pages
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
